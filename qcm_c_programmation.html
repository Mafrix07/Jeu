<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM — Programmation C Système</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #13161d;
    --card: #1a1e28;
    --border: #252a38;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --green: #22d3a0;
    --red: #ff4d6d;
    --text: #e2e8f0;
    --muted: #64748b;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* ── GRID BACKGROUND ── */
  body::before {
    content:'';
    position:fixed; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(0,229,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index:0;
  }

  .wrap { position:relative; z-index:1; width:100%; max-width:780px; }

  /* ── SCREEN TRANSITIONS ── */
  .screen { display:none; animation: fadeIn .35s ease; }
  .screen.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

  /* ══════════════════════ WELCOME ══════════════════════ */
  #screen-welcome { text-align:center; padding: 60px 20px; }

  .logo {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: .7;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 14px;
  }

  .subtitle {
    color: var(--muted);
    font-size: .95rem;
    font-family: var(--mono);
    margin-bottom: 48px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 48px;
  }

  .stat-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 22px;
    text-align:center;
  }
  .stat-chip .num { font-size: 1.7rem; font-weight:800; color: var(--accent); font-family:var(--mono); }
  .stat-chip .lbl { font-size:.75rem; color:var(--muted); margin-top:2px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 36px;
    border-radius: 12px;
    border: none;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    letter-spacing:.5px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #0080a0);
    color: #000;
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow: 0 8px 24px rgba(0,229,255,.3); }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color:var(--accent); }

  /* ══════════════════════ QUIZ ══════════════════════ */
  #screen-quiz { padding-top: 10px; }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .q-counter {
    font-family: var(--mono);
    font-size: .85rem;
    color: var(--muted);
  }
  .q-counter span { color: var(--accent); font-weight:700; }

  .score-live {
    font-family: var(--mono);
    font-size: .85rem;
    color: var(--muted);
  }
  .score-live .s { color: var(--green); font-weight:700; }

  .timer-badge {
    font-family: var(--mono);
    font-size:.85rem;
    padding: 6px 14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    color: var(--accent);
  }

  /* Progress bar */
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-fill {
    height:100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius:2px;
    transition: width .4s ease;
  }

  /* Question card */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 30px;
    margin-bottom: 20px;
  }

  .q-num {
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 12px;
    opacity:.7;
  }

  .q-text {
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.5;
    color: #fff;
  }

  /* Options */
  .options { display:flex; flex-direction:column; gap:10px; }

  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all .15s;
    text-align: left;
    color: var(--text);
    font-family: var(--sans);
    font-size: .95rem;
    line-height:1.4;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(0,229,255,.06);
    color: #fff;
  }

  .opt-letter {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--border);
    display: flex; align-items:center; justify-content:center;
    font-family: var(--mono);
    font-size: .8rem;
    font-weight:700;
    color: var(--muted);
    transition: all .15s;
  }

  .opt-btn:hover:not(:disabled) .opt-letter {
    background: rgba(0,229,255,.15);
    color: var(--accent);
  }

  .opt-btn.correct {
    border-color: var(--green) !important;
    background: rgba(34,211,160,.08) !important;
  }
  .opt-btn.correct .opt-letter {
    background: var(--green) !important;
    color:#000 !important;
  }
  .opt-btn.wrong {
    border-color: var(--red) !important;
    background: rgba(255,77,109,.08) !important;
  }
  .opt-btn.wrong .opt-letter {
    background: var(--red) !important;
    color:#fff !important;
  }
  .opt-btn:disabled { cursor:default; }

  /* Feedback box */
  .feedback-box {
    display:none;
    background: var(--surface);
    border-radius: 12px;
    padding: 16px 18px;
    margin-top: 14px;
    font-size:.9rem;
    line-height:1.5;
    border-left: 3px solid var(--green);
    color: var(--text);
  }
  .feedback-box.wrong-fb { border-left-color: var(--red); }
  .feedback-box .fb-icon { margin-right:8px; }
  .feedback-box.show { display:block; animation:fadeIn .25s ease; }

  /* Next button */
  .next-row {
    display:flex;
    justify-content:flex-end;
    margin-top:20px;
    gap: 12px;
  }

  /* ══════════════════════ RESULTS ══════════════════════ */
  #screen-results { padding: 40px 20px; text-align:center; }

  .result-ring {
    position: relative;
    display: inline-flex;
    align-items:center;
    justify-content:center;
    margin: 0 auto 32px;
  }

  .ring-svg { transform:rotate(-90deg); }

  .ring-center {
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .ring-pct { font-size:2.2rem; font-weight:800; font-family:var(--mono); color:#fff; line-height:1; }
  .ring-lbl { font-size:.75rem; color:var(--muted); margin-top:4px; }

  .result-mention {
    font-size: 1.5rem;
    font-weight:800;
    margin-bottom:8px;
  }
  .result-sub {
    color:var(--muted);
    font-size:.9rem;
    font-family:var(--mono);
    margin-bottom:40px;
  }

  .results-grid {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap:14px;
    margin-bottom:36px;
  }
  .res-cell {
    background: var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 10px;
  }
  .res-cell .big { font-size:1.6rem; font-weight:800; font-family:var(--mono); }
  .res-cell .sm { font-size:.75rem; color:var(--muted); margin-top:4px; }
  .col-green .big { color: var(--green); }
  .col-red .big { color: var(--red); }
  .col-accent .big { color: var(--accent); }

  /* Errors accordion */
  .errors-section { text-align:left; margin-bottom:32px; }
  .errors-title {
    font-size:.85rem;
    color:var(--muted);
    font-family:var(--mono);
    margin-bottom:12px;
    text-transform:uppercase;
    letter-spacing:2px;
  }
  .err-item {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:8px;
    font-size:.85rem;
    line-height:1.5;
  }
  .err-item .eq { color:var(--text); margin-bottom:4px; }
  .err-item .ea { color:var(--red); font-family:var(--mono); font-size:.8rem; }
  .err-item .ec { color:var(--green); font-family:var(--mono); font-size:.8rem; }

  .result-btns { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

  @media(max-width:520px){
    .q-card { padding:20px 16px; }
    h1 { font-size:1.8rem; }
    .stats-row { gap:12px; }
  }
</style>
</head>
<body>
<div class="wrap">

<!-- ═══ WELCOME ═══ -->
<div id="screen-welcome" class="screen active">
  <p class="logo">// Programmation Système</p>
  <h1>QCM<br>Langage C</h1>
  <p class="subtitle">209 questions · Session de 150 aléatoires</p>
  <div class="stats-row">
    <div class="stat-chip"><div class="num">209</div><div class="lbl">Questions</div></div>
    <div class="stat-chip"><div class="num">150</div><div class="lbl">Par session</div></div>
    <div class="stat-chip"><div class="num">6</div><div class="lbl">Modules</div></div>
    <div class="stat-chip"><div class="num">4</div><div class="lbl">Choix / Q</div></div>
  </div>
  <button class="btn btn-primary" onclick="startQuiz()">▶ Démarrer le QCM</button>
</div>

<!-- ═══ QUIZ ═══ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <div class="q-counter">Question <span id="q-idx">1</span> / <span id="q-total">150</span></div>
    <div class="timer-badge" id="timer">00:00</div>
    <div class="score-live">Score&nbsp;<span class="s" id="live-score">0</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div class="q-card">
    <div class="q-num" id="q-num-label">Q001</div>
    <div class="q-text" id="q-text">Chargement…</div>
  </div>

  <div class="options" id="options-container"></div>

  <div class="feedback-box" id="feedback-box"></div>

  <div class="next-row">
    <button class="btn btn-secondary" id="btn-quit" onclick="confirmQuit()">Quitter</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()" style="display:none">
      Suivant →
    </button>
  </div>
</div>

<!-- ═══ RESULTS ═══ -->
<div id="screen-results" class="screen">
  <p class="logo">// Résultats finaux</p>

  <div class="result-ring">
    <svg class="ring-svg" width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="68" fill="none" stroke="#1a1e28" stroke-width="12"/>
      <circle id="ring-arc" cx="80" cy="80" r="68" fill="none" stroke="url(#rg)" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="427"/>
      <defs>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="ring-center">
      <div class="ring-pct" id="res-pct">0%</div>
      <div class="ring-lbl">Score</div>
    </div>
  </div>

  <div class="result-mention" id="res-mention">—</div>
  <div class="result-sub" id="res-sub">—</div>

  <div class="results-grid">
    <div class="res-cell col-green"><div class="big" id="res-correct">0</div><div class="sm">✅ Correctes</div></div>
    <div class="res-cell col-red"><div class="big" id="res-wrong">0</div><div class="sm">❌ Incorrectes</div></div>
    <div class="res-cell col-accent"><div class="big" id="res-time">0:00</div><div class="sm">⏱ Durée</div></div>
  </div>

  <div class="errors-section" id="errors-section"></div>

  <div class="result-btns">
    <button class="btn btn-primary" onclick="startQuiz()">🔄 Nouvelle session</button>
    <button class="btn btn-secondary" onclick="showScreen('screen-welcome')">🏠 Accueil</button>
  </div>
</div>

</div><!-- .wrap -->

<script>
const ALL_QUESTIONS = 
[{"q": "Quel système d'exploitation a rendu le C célèbre ?", "options": ["A) Windows", "B) DOS", "C) Unix", "D) macOS"], "answer": "C", "explication": "Unix a été réécrit en C, ce qui a popularisé le langage dans le monde entier."}, {"q": "Dans quel laboratoire le C a-t-il été créé ?", "options": ["A) Les laboratoires Microsoft", "B) Les Bell Labs d'AT&T", "C) Le MIT", "D) Stanford"], "answer": "B", "explication": "Dennis Ritchie travaillait aux Bell Labs (laboratoires d'AT&T) quand il a créé le C."}, {"q": "Quelle norme du C a été publiée en 1989 et est souvent appelée 'ANSI C' ?", "options": ["A) C77", "B) C89", "C) C99", "D) C11"], "answer": "B", "explication": "La norme C89 (ou ANSI C) est la première norme officielle du langage C, publiée en 1989."}, {"q": "Quelle norme du C a introduit les commentaires // et les tableaux à taille variable ?", "options": ["A) C89", "B) C95", "C) C99", "D) C11"], "answer": "C", "explication": "Le C99 (1999) a ajouté les commentaires // et les tableaux à taille variable entre autres améliorations."}, {"q": "Lequel de ces langages a été fortement influencé par le C ?", "options": ["A) COBOL", "B) FORTRAN", "C) Java", "D) SQL"], "answer": "C", "explication": "Java, C++, C#, Python et de nombreux langages modernes sont fortement influencés par la syntaxe du C."}, {"q": "Quelle est la principale qualité du langage C qui le rend encore utilisé aujourd'hui ?", "options": ["A) Il est facile à apprendre", "B) Il est très proche du matériel et très performant", "C) Il est orienté objet", "D) Il a une bibliothèque graphique intégrée"], "answer": "B", "explication": "Le C permet d'écrire du code proche du matériel, ce qui le rend très performant pour les systèmes embarqués et les OS."}, {"q": "Quel livre célèbre a été écrit par les créateurs du C et est encore une référence aujourd'hui ?", "options": ["A) 'The Art of Computer Programming'", "B) 'The C Programming Language' (Kernighan & Ritchie)", "C) 'Clean Code'", "D) 'Structure and Interpretation of Computer Programs'"], "answer": "B", "explication": "'The C Programming Language' de Brian Kernighan et Dennis Ritchie (le fameux 'K&R') est la bible du C."}, {"q": "Quel IDE est recommandé pour programmer en C sous Windows avec le compilateur MinGW ?", "options": ["A) Xcode", "B) Code::Blocks", "C) Eclipse", "D) NetBeans"], "answer": "B", "explication": "Code::Blocks avec mingw-setup.exe est la solution recommandée sous Windows pour les débutants."}, {"q": "Quel IDE Apple est disponible sur l'App Store pour programmer en C sur Mac ?", "options": ["A) Visual Studio", "B) Code::Blocks", "C) Xcode", "D) Dev-C++"], "answer": "C", "explication": "Xcode est l'environnement de développement d'Apple, disponible gratuitement sur le Mac App Store."}, {"q": "Sous Linux, quel compilateur C est généralement déjà installé ou facilement disponible ?", "options": ["A) Xcode", "B) MinGW", "C) GCC", "D) Clang seulement"], "answer": "C", "explication": "GCC (GNU Compiler Collection) est le compilateur standard sous Linux, souvent déjà installé."}, {"q": "Quel éditeur de code très populaire (gratuit, de Microsoft) fonctionne sur Windows, Mac et Linux ?", "options": ["A) Notepad++", "B) Visual Studio Code", "C) Sublime Text", "D) Atom"], "answer": "B", "explication": "Visual Studio Code (VS Code) est un éditeur léger et gratuit qui fonctionne sur tous les systèmes."}, {"q": "Quelle est la différence entre un IDE et un simple éditeur de texte pour programmer en C ?", "options": ["A) Aucune différence", "B) Un IDE intègre compilation, débogage et aide au code en un seul outil", "C) Un éditeur de texte est plus rapide", "D) Un IDE ne peut que compiler"], "answer": "B", "explication": "Un IDE (Environnement de Développement Intégré) combine éditeur, compilateur, débogueur et autres outils."}, {"q": "Quelle version gratuite de Visual Studio (Microsoft) peut-on utiliser pour programmer en C ?", "options": ["A) Visual Studio Professional", "B) Visual Studio Ultimate", "C) Visual Studio Community", "D) Visual Studio Lite"], "answer": "C", "explication": "Visual Studio Community est la version gratuite de Microsoft, idéale pour les étudiants et débutants."}, {"q": "Sous Windows, quel outil (compilateur) faut-il installer pour que Code::Blocks puisse compiler du C ?", "options": ["A) GCC directement", "B) MinGW (Minimalist GNU for Windows)", "C) Clang", "D) MSVC"], "answer": "B", "explication": "MinGW est un portage de GCC pour Windows. Code::Blocks avec le setup 'mingw' l'inclut automatiquement."}, {"q": "Quelle commande Linux permet de vérifier si GCC est bien installé ?", "options": ["A) gcc --help", "B) gcc --version", "C) which gcc", "D) B et C sont tous les deux corrects"], "answer": "D", "explication": "'gcc --version' affiche la version installée et 'which gcc' indique son emplacement. Les deux fonctionnent."}, {"q": "Que signifie IDE ?", "options": ["A) Interface De l'Entreprise", "B) Integrated Development Environment (Environnement de Développement Intégré)", "C) Internal Debug Editor", "D) Internet Development Engine"], "answer": "B", "explication": "IDE = Integrated Development Environment, un outil tout-en-un pour coder, compiler et déboguer."}, {"q": "Quel opérateur permet d'accéder à la valeur pointée par un pointeur ?", "options": ["A) &", "B) ->", "C) *", "D) ."], "answer": "C", "explication": "* (déréférencement) accède à la valeur à l'adresse stockée dans le pointeur."}, {"q": "Que vaut *p si p contient l'adresse d'une variable age qui vaut 25 ?", "options": ["A) L'adresse de age", "B) 25", "C) NULL", "D) La taille de int"], "answer": "B", "explication": "*p déréférence le pointeur : cela donne la valeur stockée à l'adresse pointée, donc 25."}, {"q": "Après int x = 10; int *p = &x; *p = 20; que vaut x ?", "options": ["A) 10", "B) L'adresse de x", "C) 20", "D) NULL"], "answer": "C", "explication": "*p = 20 modifie la valeur à l'adresse pointée par p, c'est-à-dire x. Donc x vaut maintenant 20."}, {"q": "Que se passe-t-il si on utilise un pointeur qui n'a pas été initialisé ?", "options": ["A) Il pointe automatiquement sur NULL", "B) Comportement imprévisible, plantage possible", "C) La valeur vaut 0", "D) Le compilateur refuse de compiler"], "answer": "B", "explication": "Un pointeur non initialisé contient une adresse aléatoire. Le déréférencer peut provoquer un crash (segfault)."}, {"q": "Pourquoi passe-t-on un pointeur à une fonction au lieu de la valeur directe ?", "options": ["A) Pour que la fonction puisse modifier la variable originale", "B) Pour économiser de la mémoire", "C) Parce que c'est obligatoire", "D) Pour accélérer le programme"], "answer": "A", "explication": "En passant l'adresse (pointeur), la fonction peut modifier la variable originale, pas seulement sa copie."}, {"q": "Quelle est la relation entre le nom d'un tableau et les pointeurs ?", "options": ["A) Aucune relation", "B) Le nom du tableau est l'adresse de son premier élément, comme un pointeur", "C) Seulement pour les tableaux de char", "D) Seulement pour les tableaux globaux"], "answer": "B", "explication": "En C, le nom d'un tableau (ex: tab) représente l'adresse de tab[0], exactement comme un pointeur."}, {"q": "Que signifie 'Segmentation fault' (ou Segfault) ?", "options": ["A) Erreur de syntaxe dans le code", "B) Division par zéro", "C) Accès à une zone mémoire non autorisée", "D) Fichier non trouvé"], "answer": "C", "explication": "Un segfault survient quand le programme tente d'accéder à de la mémoire qui ne lui appartient pas."}, {"q": "Que retourne strchr() comme valeur quand elle trouve le caractère cherché ?", "options": ["A) L'indice du caractère", "B) Un pointeur vers ce caractère dans la chaîne", "C) La valeur ASCII du caractère", "D) 1 (vrai)"], "answer": "B", "explication": "strchr() retourne un pointeur vers le premier caractère trouvé dans la chaîne."}, {"q": "Quelle est la bonne façon d'initialiser un pointeur qui ne pointe sur rien pour l'instant ?", "options": ["A) int *p = 0;", "B) int *p , "explication": "== teste l'égalité ; = est l'affectation."}, {"q": "Que vaut l'expression : 7 / 2 en C (entiers) ?", "options": ["A) 3.5", "B) 4", "C) 3", "D) 2"], "answer": "C", "explication": "La division entière tronque le résultat : 7/2 = 3."}, {"q": "Qu'est-ce que le transtypage (cast) en C ?", "options": ["A) Changer le nom d'une variable", "B) Convertir une valeur d'un type à un autre", "C) Déclarer plusieurs variables", "D) Allouer de la mémoire"], "answer": "B", "explication": "Le cast (int)x convertit explicitement x en entier."}, {"q": "Que retourne sizeof(int) sur la plupart des systèmes 32/64 bits ?", "options": ["A) 1", "B) 2", "C) 4", "D) 8"], "answer": "C", "explication": "sizeof(int) retourne généralement 4 (octets)."}, {"q": "Quel est le résultat de !0 en C ?", "options": ["A) 0", "B) -1", "C) 1", "D) NULL"], "answer": "C", "explication": "!0 = 1 (NOT logique de faux donne vrai)."}, {"q": "Quelle structure teste une condition en C ?", "options": ["A) when", "B) if", "C) test", "D) check"], "answer": "B", "explication": "if() est la structure conditionnelle de base."}, {"q": "Quelle boucle s'exécute au moins une fois même si la condition est fausse ?", "options": ["A) for", "B) while", "C) do...while", "D) loop"], "answer": "C", "explication": "do...while teste la condition APRÈS la première exécution."}, {"q": "Quelle instruction sort immédiatement d'une boucle en C ?", "options": ["A) exit", "B) stop", "C) continue", "D) break"], "answer": "D", "explication": "break interrompt immédiatement la boucle courante."}, {"q": "Que fait continue dans une boucle ?", "options": ["A) Sort de la boucle", "B) Passe à l'itération suivante", "C) Réinitialise le compteur", "D) Met la boucle en pause"], "answer": "B", "explication": "continue saute le reste du corps et passe à l'itération suivante."}, {"q": "Quelle structure permet de tester plusieurs valeurs d'une variable entière ?", "options": ["A) multiif", "B) select", "C) switch", "D) choose"], "answer": "C", "explication": "switch...case permet de tester plusieurs valeurs."}, {"q": "Que se passe-t-il si on oublie break dans un case de switch ?", "options": ["A) Erreur de compilation", "B) Le programme crash", "C) L'exécution continue dans le case suivant (fall-through)", "D) Le case est ignoré"], "answer": "C", "explication": "Sans break, le fall-through provoque l'exécution du case suivant."}, {"q": "Quelle est la syntaxe correcte d'une boucle for comptant de 0 à 9 ?", "options": ["A) for(i=0; i<10; i++)", "B) for(i=0 to 9)", "C) for i in range(10):", "D) loop(i=0; i<10)"], "answer": "A", "explication": "for(init; condition; incrément) est la syntaxe correcte."}, {"q": "Quel mot-clé introduit un bloc alternatif au if ?", "options": ["A) otherwise", "B) else", "C) or", "D) default"], "answer": "B", "explication": "else introduit le bloc exécuté si la condition du if est fausse."}, {"q": "Quelle est la condition d'une boucle while infinie ?", "options": ["A) while(false)", "B) while(0)", "C) while(1)", "D) while()"], "answer": "C", "explication": "while(1) ou while(true) crée une boucle infinie."}, {"q": "Peut-on imbriquer des if en C ?", "options": ["A) Non, c'est interdit", "B) Oui, sans limitation théorique", "C) Oui, mais max 3 niveaux", "D) Seulement avec des accolades spéciales"], "answer": "B", "explication": "Les structures de contrôle peuvent être imbriquées librement."}, {"q": "Comment déclarer une fonction qui ne retourne rien en C ?", "options": ["A) null maFonction()", "B) void maFonction()", "C) none maFonction()", "D) empty maFonction()"], "answer": "B", "explication": "void indique qu'une fonction ne retourne pas de valeur."}, {"q": "Qu'est-ce qu'un prototype de fonction en C ?", "options": ["A) La définition complète de la fonction", "B) La déclaration de la signature avant le corps", "C) Un modèle de fonction générique", "D) Une fonction récursive"], "answer": "B", "explication": "Le prototype déclare la signature (type, nom, paramètres) avant la dé e code de retour fourni au système d'exploitation."}, {"q": "Quelle est la différence entre i++ et ++i ?", "options": ["A) Aucune différence", "B) i++ incrémente puis retourne l'ancienne valeur ; ++i incrémente et retourne la nouvelle", "C) ++i est interdit en C", "D) i++ est plus rapide"], "answer": "B", "explication": "i++ (post-incrément) : utilise puis incrémente. ++i (pré-incrément) : incrémente puis utilise."}, {"q": "Que vaut (int)(3.9) en C ?", "options": ["A) 4", "B) 3", "C) 4.0", "D) Erreur"], "answer": "B", "explication": "Le cast (int) tronque vers zéro : (int)3.9 = 3."}, {"q": "Quelle en-tête fournit les fonctions mathématiques (sqrt, cos...) ?", "options": ["A) <calc.h>", "B) <numeric.h>", "C) <math.h>", "D) <maths.h>"], "answer": "C", "explication": "math.h contient sqrt(), pow(), sin(), cos(), etc. (compiler avec -lm)."}, {"q": "Comment éviter les inclusions multiples d'un fichier .h ?", "options": ["A) #once", "B) #pragma once ou #ifndef HEADER_H / #define HEADER_H / #endif", "C) #norepeat", "D) #include_once"], "answer": "B", "explication": "Les include guards (#ifndef) ou #pragma once évitent les inclusions multiples."}, {"q": "Qu'est-ce qu'un enum en C ?", "options": ["A) Un tableau énuméré", "B) Un type permettant de nommer des constantes entières", "C) Un pointeur de liste", "D) Une boucle d'énumération"], "answer": "B", "explication": "enum { LUNDI, MARDI, ... } définit des constantes entières nommées."}, {"q": "Quelle valeur commence par défaut le premier membre d'un enum ?", "options": ["A) 1", "B) -1", "C) 0", "D) Indéfini"], "answer": "C", "explication": "Sans valeur explicite, le premier membre d'un enum vaut 0."}, {"q": "Qu'est-ce qu'une variable automatique (auto) en C ?", "options": ["A) Une variable allouée sur le tas", "B) Une variable locale allouée sur la pile (comportement par défaut)", "C) Une variable globale automatiquement initialisée", "D) Un pointeur auto-déférencement"], "answer": "B", "explication": "auto est la classe de // ── State ──────────────────────────────────────────────
let session = [];
let current = 0;
let score = 0;
let errors = [];
let timerInterval = null;
let startTime = null;
let answered = false;

// ── Helpers ────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ── Start ──────────────────────────────────────────────
function startQuiz() {
  session = shuffle(ALL_QUESTIONS).slice(0, 150);
  current = 0;
  score = 0;
  errors = [];
  startTime = Date.now();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  showScreen('screen-quiz');
  renderQuestion();
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('timer').textContent = fmtTime(elapsed);
}

// ── Render ─────────────────────────────────────────────
function renderQuestion() {
  answered = false;
  const q = session[current];
  const total = session.length;

  document.getElementById('q-idx').textContent = current + 1;
  document.getElementById('q-total').textContent = total;
  document.getElementById('q-num-label').textContent = `Q${String(current + 1).padStart(3,'0')}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('live-score').textContent = score;

  const pct = (current / total) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';

  const fb = document.getElementById('feedback-box');
  fb.className = 'feedback-box';
  fb.textContent = '';

  document.getElementById('btn-next').style.display = 'none';

  const cont = document.getElementById('options-container');
  cont.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${escHtml(opt)}</span>`;
    btn.onclick = () => selectAnswer(letters[i], btn);
    cont.appendChild(btn);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Answer ─────────────────────────────────────────────
function selectAnswer(letter, clickedBtn) {
  if (answered) return;
  answered = true;

  const q = session[current];
  const correct = q.answer;
  const letters = ['A','B','C','D'];
  const allBtns = document.querySelectorAll('.opt-btn');

  allBtns.forEach((b, i) => {
    b.disabled = true;
    if (letters[i] === correct) b.classList.add('correct');
    else if (letters[i] === letter && letter !== correct) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback-box');
  if (letter === correct) {
    score++;
    fb.innerHTML = `<span class="fb-icon">✅</span><strong>Bonne réponse !</strong> ${escHtml(q.explication)}`;
    fb.className = 'feedback-box show';
  } else {
    errors.push({ num: current + 1, q: q.q, given: letter, correct });
    fb.innerHTML = `<span class="fb-icon">❌</span><strong>Mauvaise réponse.</strong> La bonne était <strong>${correct}</strong>. ${escHtml(q.explication)}`;
    fb.className = 'feedback-box wrong-fb show';
  }

  document.getElementById('live-score').textContent = score;
  document.getElementById('btn-next').style.display = 'flex';
}

// ── Navigation ─────────────────────────────────────────
function nextQuestion() {
  current++;
  if (current >= session.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function confirmQuit() {
  if (confirm('Quitter le QCM en cours ?')) {
    clearInterval(timerInterval);
    showScreen('screen-welcome');
  }
}

// ── Results ────────────────────────────────────────────
function showResults() {
  clearInterval(timerInterval);
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const total = session.length;
  const pct = Math.round((score / total) * 100);

  // animate ring
  const circumference = 427;
  const offset = circumference - (pct / 100) * circumference;
  setTimeout(() => {
    document.getElementById('ring-arc').style.transition = 'stroke-dashoffset 1s ease';
    document.getElementById('ring-arc').style.strokeDashoffset = offset;
  }, 100);

  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('res-correct').textContent = score;
  document.getElementById('res-wrong').textContent = total - score;
  document.getElementById('res-time').textContent = fmtTime(elapsed);

  let mention, color;
  if (pct >= 90) { mention = '🏆 Excellent !'; color='#00e5ff'; }
  else if (pct >= 75) { mention = '🥇 Très bien !'; color='#22d3a0'; }
  else if (pct >= 60) { mention = '👍 Bien'; color='#22d3a0'; }
  else if (pct >= 40) { mention = '😐 Passable'; color='#f59e0b'; }
  else { mention = '📚 À retravailler'; color='#ff4d6d'; }

  const mEl = document.getElementById('res-mention');
  mEl.textContent = mention;
  mEl.style.color = color;

  const m = Math.floor(elapsed/60), s = elapsed%60;
  document.getElementById('res-sub').textContent =
    `${score} / ${total} correctes · ${m}m ${s}s · ${errors.length} erreur(s)`;

  // Errors list
  const sec = document.getElementById('errors-section');
  if (errors.length === 0) {
    sec.innerHTML = '<p style="color:var(--green);text-align:center;font-size:.9rem">🎉 Aucune erreur !</p>';
  } else {
    let html = `<p class="errors-title">Questions ratées (${errors.length})</p>`;
    errors.forEach(e => {
      html += `<div class="err-item">
        <div class="eq">${escHtml(e.q.length > 90 ? e.q.slice(0,90)+'…' : e.q)}</div>
        <div class="ea">Votre réponse : ${e.given} &nbsp;&nbsp; <span class="ec">Bonne : ${e.correct}</span></div>
      </div>`;
    });
    sec.innerHTML = html;
  }

  showScreen('screen-results');
}
</script>
